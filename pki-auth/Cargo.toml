[package]
name = "s2-pki-auth"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []

[dependencies]
base64ct = { version = "1.8", features = ["alloc"] }
biscuit-auth = "6"
bs58 = "0.5"
http = "1"
httpsig = "0.0.26"
p256 = "0.13"
rand = "0.8"
s2-common = { version = "0.42.0", path = "../common" }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
thiserror = "2"
time = "0.3"

[dev-dependencies]
prost = "0.10"
