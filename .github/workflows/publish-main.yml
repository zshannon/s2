name: Publish main to GHCR

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-main-ghcr
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/zshannon/s2

jobs:
  build:
    if: github.repository == 'zshannon/s2' && github.ref == 'refs/heads/main'
    name: Build ${{ matrix.arch }} image
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Build and push architecture image
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0
        with:
          context: .
          file: Dockerfile
          target: runtime
          platforms: linux/${{ matrix.arch }}
          push: true
          build-args: |
            S2_GIT_REV=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/zshannon/s2
            org.opencontainers.image.documentation=https://github.com/zshannon/s2
            org.opencontainers.image.revision=${{ github.sha }}
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }}-${{ matrix.arch }}

  publish:
    if: github.repository == 'zshannon/s2' && github.ref == 'refs/heads/main'
    name: Publish multi-architecture image
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Publish commit and latest tags
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          docker buildx imagetools create \
            --tag "$IMAGE:sha-$SOURCE_SHA" \
            --tag "$IMAGE:latest" \
            "$IMAGE:sha-$SOURCE_SHA-amd64" \
            "$IMAGE:sha-$SOURCE_SHA-arm64"
