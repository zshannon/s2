name: Sync upstream main

on:
  pull_request:
    paths:
      - ".github/scripts/sync-upstream.cjs"
      - ".github/scripts/test-sync-upstream.cjs"
      - ".github/workflows/sync-upstream.yml"
  schedule:
    - cron: "0 9 * * 2"
      timezone: America/Los_Angeles
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-upstream-main-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test upstream proposal state transitions
        env:
          TEST_REPO: ${{ github.event.repository.name }}
        run: node --test .github/scripts/test-sync-upstream.cjs

  open-pull-request:
    if: github.event_name != 'pull_request' && github.repository == 'zshannon/s2' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require the scoped upstream credential
        env:
          UPSTREAM_SYNC_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
        run: |
          if [ -z "$UPSTREAM_SYNC_TOKEN" ]; then
            echo "::error::Configure UPSTREAM_SYNC_TOKEN before enabling this workflow; see .github/UPSTREAM_SYNC.md."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Open or update an editable draft proposal
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
          script: |
            const syncUpstream = require('./.github/scripts/sync-upstream.cjs');
            await syncUpstream({ context, core, github });
